<script src="https://cdn.tailwindcss.com"></script>

<div class="bg-slate-100 min-h-screen p-4 md:p-8 flex flex-col items-center font-sans">

  <div class="w-full max-w-2xl bg-white rounded-lg shadow-md p-6 md:p-8 mt-6">
    <h1 class="text-3xl font-bold text-slate-800 text-center mb-6">Tablero de Tareas</h1>
    
    <form id="todo-form" class="flex gap-2 mb-8">
      <input 
        type="text" 
        id="todo-input" 
        placeholder="Escribe una nueva tarea..." 
        class="flex-1 px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      >
      <button 
        type="submit" 
        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-md font-medium transition-colors whitespace-nowrap"
      >
        Agregar
      </button>
    </form>

    <div id="todos-container" class="space-y-4">
      <p class="text-slate-500 text-center py-4">Conectando con la API REST...</p>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://jsonplaceholder.typicode.com/todos';
  const todosContainer = document.getElementById('todos-container');
  const todoForm = document.getElementById('todo-form');
  const todoInput = document.getElementById('todo-input');
  
  let localTodos = [];

  // 1. Consumo inicial de datos (GET)
  async function fetchTodos() {
    try {
      const response = await fetch(`${API_URL}?_limit=8`);
      localTodos = await response.json();
      renderTodos();
    } catch (error) {
      todosContainer.innerHTML = `<p class="text-red-500 text-center">Error al conectar con JSONPlaceholder.</p>`;
      console.error(error);
    }
  }

  // Renderizar las tarjetas clonando el estilo de las fases previas
  function renderTodos() {
    if (localTodos.length === 0) {
      todosContainer.innerHTML = `<p class="text-slate-500 text-center py-4">No hay tareas en la lista.</p>`;
      return;
    }

    todosContainer.innerHTML = localTodos.map(todo => `
      <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-slate-50 border border-slate-200 rounded-lg gap-4 transition-all duration-200">
        <div class="flex-1">
          <h3 class="font-semibold ${todo.completed ? 'line-through text-slate-400' : 'text-slate-800'}">
            ${todo.title}
          </h3>
          <div class="mt-2 flex gap-2">
            <span class="rounded-full px-2.5 py-0.5 text-xs font-semibold ${
              todo.completed ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800'
            }">
              ${todo.completed ? 'Completada' : 'Pendiente'}
            </span>
          </div>
        </div>
        <div class="flex gap-2 self-end sm:self-center">
          <button 
            onclick="toggleTodo(${todo.id})"
            class="px-3 py-1.5 text-xs font-medium rounded bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 transition-colors"
          >
            ${todo.completed ? 'Desmarcar' : 'Completar'}
          </button>
          <button 
            onclick="deleteTodo(${todo.id})"
            class="px-3 py-1.5 text-xs font-medium rounded bg-red-50 text-red-600 hover:bg-red-100 transition-colors"
          >
            Eliminar
          </button>
        </div>
      </div>
    `).join('');
  }

  // 2. Enviar nueva tarea (POST)
  todoForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = todoInput.value.trim();
    
    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          title: title,
          completed: false,
          userId: 1
        }),
        headers: {
          'Content-type': 'application/json; charset=UTF-8',
        },
      });
      
      const newTodo = await response.json();
      
      // Asignar ID único basado en tiempo para el manejo de la UI local
      newTodo.id = Date.now();
      
      localTodos.unshift(newTodo);
      todoInput.value = '';
      renderTodos();
    } catch (error) {
      alert('Error en la petición POST');
      console.error(error);
    }
  });

  // 3. Actualizar estado (PUT)
  async function toggleTodo(id) {
    const todo = localTodos.find(t => t.id === id);
    if (!todo) return;

    try {
      await fetch(`${API_URL}/${id}`, {
        method: 'PUT',
        body: JSON.stringify({
          ...todo,
          completed: !todo.completed
        }),
        headers: {
          'Content-type': 'application/json; charset=UTF-8',
        },
      });

      todo.completed = !todo.completed;
      renderTodos();
    } catch (error) {
      alert('Error en la petición PUT');
    }
  }

  // 4. Borrar registro (DELETE)
  async function deleteTodo(id) {
    try {
      await fetch(`${API_URL}/${id}`, {
        method: 'DELETE',
      });

      localTodos = localTodos.filter(t => t.id !== id);
      renderTodos();
    } catch (error) {
      alert('Error en la petición DELETE');
    }
  }

  // Inicializar carga de datos de la API
  fetchTodos();
</script>
